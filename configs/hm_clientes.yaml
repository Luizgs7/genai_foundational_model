# Config canônico do dataset H&M Personalized Fashion Recommendations
# (mirror HF einrafh/hnm-fashion-recommendations-data). Entidade = CLIENTE,
# evento = ITEM comprado, âncora downstream = CESTA (cliente + dia).
# Números de referência: runs/hm_clientes/eda/eda.json (adapters/eda_hm.py).
#
# 31,8M itens, 1,36M clientes com compra, 9,08M cestas (3,5 itens/cesta em
# média), 734 dias (2018-09-20 a 2020-09-22).

nome: hm_clientes
entidade_label: cliente
fonte_canonica: runs/hm_clientes/eventos_canonicos.parquet

campos_categoricos:
  - nome: indice                 # 10 (Ladieswear, Divided, Menswear, ...)
    estrategia: fechado
  - nome: grupo_produto          # 19
    estrategia: fechado
  - nome: tipo_produto           # 130 (Trousers, Dress, Sweater, ...)
    estrategia: fechado
  - nome: cor                    # 50
    estrategia: fechado
  - nome: linha_vestuario        # 21 (garment_group)
    estrategia: fechado
  - nome: canal                  # loja | online
    estrategia: fechado
  - nome: artigo                 # 104,5 mil artigos vendidos; top-2000 cobre 27% das vendas
    estrategia: top_n_outros
    top_n: 2000

campos_numericos:
  # preço vem normalizado na fonte; faixa por grupo de produto (19 x 10 tokens):
  # uma meia "cara" e um casaco "barato" não são comparáveis em valor absoluto.
  - nome: preco
    agrupar_por: grupo_produto
    n_buckets: 10

# Só entram na fusão / GBDT (não tokenizados):
campos_estaticos_categoricos: [clube, newsletter, cep_top]
campos_estaticos_numericos: [idade, fn, active]
campo_data_nascimento: null      # o dataset dá a idade (não a data de nascimento)

usa_recencia: true
usa_mes: true

# Ancoragem downstream por cesta: rótulos e exemplos de fusão/GBDT só no último
# item de cada (cliente, dia); "próximo" = próxima cesta. Ancorar por item
# daria rótulos triviais aos itens com outro item na mesma cesta (gap 0 dias).
ancora: cesta
# Amostra das âncoras de treino usadas downstream (val/teste ficam completos).
ancoras_treino_max: 2000000

splits:
  # Regra "janela de teste >= ~2x o horizonte de churn" (lição da Tarefa 7):
  # N=90 -> teste de 180 dias. A janela de teste (2020-03-26 a 2020-09-22)
  # contém o choque da COVID (lojas fechadas em mar-mai/2020) — documentado
  # como deslocamento de distribuição, não corrigido.
  val_window_days: 90
  test_window_days: 180

arquitetura:
  # Referência (H3) = arquitetura atual do projeto (GPT-2 + NoPE), dimensionada
  # pela regra ~20 tokens de treino / parâmetro: 227M tokens de treino ->
  # 384/6 = 11,6M parâmetros treináveis (19,6 tokens/parâmetro).
  # n_positions=1024 cobre 95,3% dos clientes inteiros e 87,3% dos eventos na
  # janela principal (2048: 99,0% / 96,4%) — o resto das âncoras recebe
  # janelas extras na extração; o contexto é uma das ablações da H8.
  tipo: gpt2_hf
  n_positions: 1024
  n_embd: 384
  n_layer: 6
  n_head: 6
  attn_implementation: sdpa

pretreino:
  tokens_por_lote: 65536        # lotes por orçamento de tokens, agrupados por tamanho
  janelas_treino: todas         # sequências > n_positions viram vários pedaços (nenhum token de treino perdido)
  n_epochs: 3
  paciencia_epocas: 1
  lr: 6.0e-4
  warmup_steps: 500
  weight_decay: 0.1
  val_a_cada_passos: 1000
  val_amostra_entidades: 5000
  checkpoint_a_cada_passos: 500
  log_a_cada_n_passos: 50

tarefas_downstream:
  - tipo: churn
    # gaps entre cestas: p50=22, p75=58, p90=124 dias; 15% dos gaps > 90 dias
    candidatos_dias: [30, 45, 60, 90, 120]
    dias_escolhido: 90
  - tipo: campo_futuro
    nome: next_category
    campo_fonte: grupo_produto_alvo    # grupo dominante da próxima cesta (10 classes)
    agregacao_cesta: moda
  - tipo: ltv
    nome: ltv_90d
    campo_valor: preco
    horizonte_dias: 90
    n_buckets: 10
  - tipo: campo_futuro
    nome: proxima_online
    campo_fonte: online                # 1 se a próxima cesta teve item online
    agregacao_cesta: max

# Feature engineering do baseline tradicional (H5 — GBDT).
features_tradicionais:
  campo_valor: preco
  campos_binarios: [online]
  campos_composicao: [indice, grupo_produto]
  max_categorias_composicao: 12
  campo_item: artigo
  campo_tipo: tipo_produto
  campo_grupo_preco: grupo_produto
  janelas_dias: [7, 30, 90, 180, 365]
  estaticos_frequencia: [cep]
